openapi: "3.1.0"
info:
  title: "YOURLS API Specification"
  version: "1.9.2"
  description: >
    YOURLS (Your Own URL Shortener) API definition.
    Handles URL shortening, expansion, and statistics retrieval.
    All endpoints are routed through a single entrypoint (yourls-api.php)
    via the `action` query parameter.
servers:
  - url: "https://example.com"
paths:
  /yourls-api.php:
    get:
      operationId: "executeYourlsAction"
      summary: "Execute YOURLS API Action"
      description: >
        The primary entrypoint for all YOURLS API operations. The specific
        operation is determined by the `action` query parameter.
        Authentication is handled via `signature` or username/password.
      parameters:
        - name: "action"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "shorturl"
              - "expand"
              - "url-stats"
              - "stats"
              - "db-stats"
              - "version"
          description: "The specific API action to execute."
        - name: "format"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "json"
              - "jsonp"
              - "xml"
              - "simple"
            default: "xml"
          description: "The desired output format."
        - name: "signature"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Authentication signature. Required if auth mechanism mandates it."
        - name: "username"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Authentication username. Used in conjunction with password."
        - name: "password"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Authentication password."
        - name: "url"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uri"
            maxLength: 2048
          description: >
            The long URL to shorten. Required when `action` is `shorturl`.
            Must start with http:// or https://.
        - name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 200
          description: >
            Custom keyword for the short URL. Optional when `action` is `shorturl`.
        - name: "title"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 200
          description: >
            Custom title for the short URL. Optional when `action` is `shorturl`.
        - name: "shorturl"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 2048
          description: >
            The short URL or keyword. Required when `action` is `expand` or `url-stats`.
        - name: "filter"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "top"
              - "bottom"
              - "rand"
              - "last"
            default: "top"
          description: >
            The filter type for global stats. Optional when `action` is `stats`.
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 10
          description: >
            The number of links to retrieve. Optional when `action` is `stats`.
        - name: "start"
          in: "query"
          required: false
          schema:
            type: "integer"
            default: 0
          description: >
            Offset for pagination. Optional when `action` is `stats`.
      responses:
        '200':
          description: "Successful operation. Output schema depends entirely on the `action` parameter."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShorturlResponse"
                  - $ref: "#/components/schemas/ExpandResponse"
                  - $ref: "#/components/schemas/UrlStatsResponse"
                  - $ref: "#/components/schemas/StatsResponse"
                  - $ref: "#/components/schemas/DbStatsResponse"
                  - $ref: "#/components/schemas/VersionResponse"
        '400':
          description: "Missing or invalid parameters."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  errorCode:
                    type: "string"
                    example: "400"
                  message:
                    type: "string"
                    example: "Unknown or missing 'action' parameter"

components:
  schemas:
    ShorturlResponse:
      type: "object"
      required:
        - "url"
        - "status"
        - "message"
        - "title"
        - "shorturl"
        - "statusCode"
      properties:
        url:
          type: "object"
          required:
            - "keyword"
            - "url"
            - "title"
            - "date"
            - "ip"
          properties:
            keyword:
              type: "string"
            url:
              type: "string"
              format: "uri"
            title:
              type: "string"
            date:
              type: "string"
              format: "date-time"
            ip:
              type: "string"
        status:
          type: "string"
        message:
          type: "string"
        title:
          type: "string"
        shorturl:
          type: "string"
          format: "uri"
        statusCode:
          type: "integer"

    ExpandResponse:
      type: "object"
      required:
        - "keyword"
        - "shorturl"
        - "longurl"
        - "message"
        - "statusCode"
      properties:
        keyword:
          type: "string"
        shorturl:
          type: "string"
          format: "uri"
        longurl:
          type: "string"
          format: "uri"
        message:
          type: "string"
        statusCode:
          type: "integer"

    UrlStatsResponse:
      type: "object"
      required:
        - "statusCode"
        - "message"
        - "link"
      properties:
        statusCode:
          type: "integer"
        message:
          type: "string"
        link:
          type: "object"
          required:
            - "shorturl"
            - "url"
            - "title"
            - "timestamp"
            - "ip"
            - "clicks"
          properties:
            shorturl:
              type: "string"
              format: "uri"
            url:
              type: "string"
              format: "uri"
            title:
              type: "string"
            timestamp:
              type: "string"
              format: "date-time"
            ip:
              type: "string"
            clicks:
              type: "integer"

    StatsResponse:
      type: "object"
      required:
        - "links"
        - "statusCode"
        - "message"
      properties:
        statusCode:
          type: "integer"
        message:
          type: "string"
        links:
          type: "object"
          additionalProperties:
            type: "object"
            required:
              - "shorturl"
              - "url"
              - "title"
              - "timestamp"
              - "ip"
              - "clicks"
            properties:
              shorturl:
                type: "string"
                format: "uri"
              url:
                type: "string"
                format: "uri"
              title:
                type: "string"
              timestamp:
                type: "string"
                format: "date-time"
              ip:
                type: "string"
              clicks:
                type: "integer"

    DbStatsResponse:
      type: "object"
      required:
        - "db-stats"
        - "statusCode"
        - "message"
      properties:
        statusCode:
          type: "integer"
        message:
          type: "string"
        db-stats:
          type: "object"
          required:
            - "total_links"
            - "total_clicks"
          properties:
            total_links:
              type: "integer"
            total_clicks:
              type: "integer"

    VersionResponse:
      type: "object"
      required:
        - "version"
      properties:
        version:
          type: "string"

