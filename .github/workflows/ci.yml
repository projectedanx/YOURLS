name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php: '8.5'
            coverage: xdebug
            flags: '--coverage-clover clover.xml'

    services:
      mysql:
        image: mariadb
        ports:
          - 3306/tcp
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: yourls_tests
          MARIADB_MYSQL_LOCALHOST_USER: 1
          MARIADB_MYSQL_LOCALHOST_GRANTS: USAGE
        options: --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@6d0aea3d0fbbcf2d91b4e1626c27f0c56e7c9a5b  # v6

    - name: Use PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@dbd5229d35997b387a27315c1a6e9b3c2f237288  # v2.37.0
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, curl, zip, dom, simplexml, intl, pdo_mysql
        tools: phpunit
        coverage: ${{ matrix.coverage }}

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@704facf57e6136b1bc63b828d79afa649  # v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
      env:
        APP_ENV: testing

    - name: Cache YOURLS language packs
      uses: actions/cache@704facf57e6136b1bc63b828d79afa649  # v4
      with:
        path: user/languages
        key: ${{ runner.os }}-languages-fr-${{ hashFiles('tests/data/config/**') }}

    - name: Prepare the application
      run: |
        git clone https://github.com/ozh/YOURLS-fr_FR.git user/languages/fr
        cp user/languages/fr/fr_FR.* user/languages
        cp tests/data/config/yourls-tests-config-ci.php user/config.php

    - name: Test
      run: phpunit --configuration phpunit.xml.dist --testdox --display-deprecations --display-notices --display-warnings --display-errors ${{ matrix.flags }}
      env:
        DB_PORT: ${{ job.services.mysql.ports['3306'] }}
        YOURLS_DB_USER: root
        YOURLS_DB_PASS: ''
        YOURLS_DB_NAME: yourls_tests
        YOURLS_DB_HOST: 127.0.0.1

    - name: Upload coverage
      if: matrix.php == '8.5'
      uses: codecov/codecov-action@v6
      with:
        files: ./clover.xml
        fail_ci_if_error: false
